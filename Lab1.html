<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <Script>
//bài 1
 const studentID = "TH01684";
const fullName = "Nguyen Van Dat";
const dateOfBirth = "01/01/2007";
const placeOfBirth = "Hanoi";
const major = "Information Technology";
console.log("=== BÀI 1 ===");
console.log(studentID);
console.log(fullName);
console.log(dateOfBirth);
console.log(placeOfBirth);
console.log(major);
//bài 2
      const salary = 1000.5;
      const isActive = true;
      const nothing = null;
      let notDefined; // Biến chưa được gán giá trị => undefined

      console.log("=== BÀI 2 ===");
      console.log("salary:", typeof salary);
      console.log("isActive:", typeof isActive);
      console.log("nothing:", typeof nothing);
      console.log("notDefined:", typeof notDefined);
//bài 3S
      const a = "10" + 5;      // "105" vì + nối chuỗi
      const b = "10" - 5;      // 5 vì - ép chuỗi thành số
      const c = Number("20"); // 20 (number)
      const d = String(123);   // "123" (string)
      const e = Boolean("");  // false
      const f = +"123";       // 123 (number)

      console.log("=== BÀI 3 ===");
      console.log('"10" + 5 =', a);
      console.log('"10" - 5 =', b);
      console.log('Number("20") =', c);
      console.log('String(123) =', d);
      console.log('Boolean("") =', e);
      console.log('+"123" =', f);
    </Script>
</body>
</html>
